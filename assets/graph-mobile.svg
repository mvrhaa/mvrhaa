81" text-anchor="end" style="font-feature-settings:'tnum'">2026-10-11</text><text x="98" y="304" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">A banking REST API built with Java 17, Spring Boot,</text><text x="98" y="322" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">Spring Data JPA, Spring Security and PostgreSQL.</text><text x="98" y="351" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">brokenlinkchecker</text><text x="418" y="351" font-size="12" font-weight="400" fill="#6e7681" text-anchor="end" style="font-feature-settings:'tnum'">2026-10-11</text><text x="98" y="370" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">A multithreaded web crawler that finds broken links,</text><text x="98" y="388" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">written in Java 17 with Maven.</text><text x="98" y="417" font-size="15" font-weight="600" fill="#e6edf3" text-anchor="start">lainai</text><text x="418" y="417" font-size="12" font-weight="400" fill="#6e7681" text-anchor="end" style="font-feature-settings:'tnum'">2026-06-26</text><text x="98" y="436" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">This is a Next.js project bootstrapped with</text><text x="98" y="454" font-size="13" font-weight="400" fill="#9198a1" text-anchor="start">create-next-app.</text></svg>