name: refresh profile graph

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: [main]
    paths: [generate.py, bio.md, "fonts/**", .github/workflows/graph.yml]

permissions:
  contents: write

concurrency: profile-graph

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.55.0 brotli==1.1.0
      - run: python generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit the new graph and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.rendered.driver "cp %B %A"
          git add -A assets data README.md
          git diff --cached --quiet || git commit -m "refresh profile graph"
          git pull --rebase origin main
          git push
