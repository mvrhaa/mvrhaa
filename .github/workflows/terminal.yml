name: refresh terminal header

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [generate.py]

permissions:
  contents: write

concurrency: terminal-header

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyfiglet
      - run: python generate.py
      - name: Commit the new SVGs and README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config merge.rendered.driver "cp %B %A"
          git add assets/terminal.svg assets/terminal-mobile.svg README.md
          git diff --cached --quiet || git commit -m "refresh terminal header"
          git pull --rebase origin main
          git push
